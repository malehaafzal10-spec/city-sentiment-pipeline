name: City Sentiment Pipeline

on:
  schedule:
    - cron: "0 8 * * 1"   # every Monday 08:00 UTC
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create artifact directories
        run: mkdir -p artifacts/logs artifacts/dashboard docs

      - name: Run pipeline
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIPELINE_ARTIFACTS_DIR: artifacts
          PIPELINE_LOG_LEVEL: INFO
          MONITOR_SENTIMENT_DROP_THRESHOLD: "0.20"
          MONITOR_MIN_MENTIONS: "5"
          LLM_JUDGE_AGREEMENT_THRESHOLD: "0.70"
        run: python run_pipeline.py --skip-llm

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-run-${{ github.run_id }}
          path: artifacts/
          retention-days: 30

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: success()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages