name: Daily Tourist Sentiment Pipeline

on:
  # Scheduled to run every day at 9:00 AM UTC
  schedule:
    - cron: '0 9 * * *'
  
  # Allows you to run the pipeline manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  run-orchestrator:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🚀 Execute Pipeline Orchestrator
        # We pass all secrets here because pipeline.py will trigger 
        # sub-scripts that require these environment variables.
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIPELINE_LOG_LEVEL: "INFO"
        run: python run_pipeline.py