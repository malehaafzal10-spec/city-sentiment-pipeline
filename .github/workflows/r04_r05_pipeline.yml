name: R04 + R05 - Score Comments and Aggregate

on:
  schedule:
    - cron: '0 19 * * *'  # 21:00 Danish time (UTC+2)

  workflow_dispatch:

jobs:
  r04-r05:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: R04 — LLM relevance + scoring on comments
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/r04_analice_sentiment.py

      - name: R05 — Aggregate sentiment scores
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
        run: python src/r05_aggregate.py

      - name: Save logs as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r04-r05-logs
          path: "*.log"
          retention-days: 30